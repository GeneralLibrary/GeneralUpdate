name: Startup health Native AOT

on:
  pull_request:
    paths:
      - 'src/GeneralUpdate.Core/StartupHealth/**'
      - 'tests/StartupHealthProbe/**'
      - '.github/workflows/startup-health-aot.yml'

jobs:
  native-aot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish and exercise readiness confirmation
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'startup-health-aot'
          dotnet publish tests\StartupHealthProbe\StartupHealthProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:TargetFrameworks=net10.0 -p:TargetFramework=net10.0 -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $state = Join-Path $env:RUNNER_TEMP 'startup-health-state'
          & (Join-Path $output 'StartupHealthProbe.exe') $state roundtrip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ready = Join-Path $env:RUNNER_TEMP 'startup-health-ready'
          [System.IO.File]::WriteAllText($ready, 'ready')
          & (Join-Path $output 'StartupHealthProbe.exe') native-handoff $state $ready
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
