name: CI Build + Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./src/GeneralUpdate.slnx

      - name: Build
        run: dotnet build ./src/GeneralUpdate.slnx -c Release --no-restore

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: dotnet test ./src/GeneralUpdate.slnx -c Release --no-build --filter "FullyQualifiedName!~ConfiginfoBuilderTests&FullyQualifiedName!~CleanBackup_KeepsOnlyRecentVersions&FullyQualifiedName!~SharedMemoryProvider_RoundTrip&FullyQualifiedName!~AutoProvider_ThrowsWhenAllFail&FullyQualifiedName!~DefaultRetryPolicy_ExponentialBackoff&FullyQualifiedName!~SimulatedCrash_ProducesDumpAndReportFiles"

      - name: Test (Ubuntu - cross-platform)
        if: runner.os == 'Linux'
        run: |
          dotnet test tests/CoreTest/CoreTest.csproj -c Release --no-build --filter "FullyQualifiedName!~ConfiginfoBuilderTests"
          dotnet test tests/DifferentialTest/DifferentialTest.csproj -c Release --no-build

  aot-verify:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: AotSmoke.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: AotSmoke
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT smoke executable
        run: dotnet publish ./tests/AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o ./artifacts/aot-smoke

      - name: Run Native AOT smoke executable
        run: ./artifacts/aot-smoke/${{ matrix.executable }}
